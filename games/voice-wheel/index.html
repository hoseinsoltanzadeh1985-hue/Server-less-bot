<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedi Voice Wheel</title><style>body{margin:0;background:radial-gradient(circle at 50% 0,#263e55,#070c12 65%);font-family:system-ui;color:#fff}.wrap{max-width:1000px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.card{background:#091622e8;border:1px solid #ffffff20;border-radius:22px;padding:16px;box-shadow:0 18px 60px #0009}.wheelBox{display:grid;place-items:center;min-height:560px}.wheel{position:relative;width:min(78vw,520px);aspect-ratio:1;border-radius:50%;background:conic-gradient(#13a8d8 0 30deg,#7b35c8 30deg 60deg,#e33c81 60deg 90deg,#16a66a 90deg 120deg,#f0ae30 120deg 150deg,#db4b35 150deg 180deg,#2854c9 180deg 210deg,#13a8d8 210deg 240deg,#7b35c8 240deg 270deg,#e33c81 270deg 300deg,#16a66a 300deg 330deg,#f0ae30 330deg 360deg);border:12px solid #d79b34;box-shadow:0 0 0 6px #3c2812,0 30px 70px #000;transition:transform 3s cubic-bezier(.12,.8,.15,1)}.wheel:before{content:'P';position:absolute;inset:34%;border-radius:50%;background:radial-gradient(circle,#c58b22,#241809 65%);display:grid;place-items:center;font-weight:900;font-size:58px;border:5px solid #e9bf67;z-index:3}.pointer{position:absolute;top:-5px;left:50%;transform:translateX(-50%);z-index:4;width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:0;border-bottom:40px solid #fff}.controls{display:grid;gap:10px}.row{display:flex;gap:8px;align-items:center}.input{background:#0b2032;border:1px solid #ffffff25;border-radius:10px;color:#fff;padding:10px;width:100%}.btn{background:linear-gradient(135deg,#f1c75c,#b96e1f);border:0;border-radius:12px;padding:12px;font-weight:900;color:#211606}.list{max-height:350px;overflow:auto}.person{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff12;padding:9px 4px}.muted{opacity:.7;font-size:12px}.result{font-size:18px;font-weight:900;color:#ffe08a}@media(max-width:800px){.grid{grid-template-columns:1fr}.wheelBox{min-height:420px}}
</style></head><body><div class="wrap"><div class="card"><h1>🎙️ گردونه انتخاب نوبت ویس‌کال</h1><div class="muted">انتخاب تصادفیِ وزنی؛ وزن هر نفر بر پایه مدت حضور ثبت‌شده در پنجره زمانی است.</div></div><div class="grid"><div class="card wheelBox"><div class="pointer"></div><div class="wheel" id="wheel"></div></div><div class="card"><h3>تنظیمات</h3><div class="controls"><label>پنجره حضور (دقیقه)<input class="input" id="window" type="number" min="5" max="120" value="120"></label><label>تعداد انتخاب<input class="input" id="count" type="number" min="1" max="20" value="3"></label><label>توان وزن (0.5 تا 1)<input class="input" id="power" type="number" step="0.05" min="0.5" max="1" value="0.75"></label><button class="btn" id="spin">چرخاندن گردونه</button></div><hr><div id="status" class="result">آماده</div><div class="list" id="list"></div></div></div></div><script>
const demo=[['Ali',6480],['Mahsa',5520],['Saeed',4320],['Zahra',3480],['Reza',2820],['Sara',2400],['Arman',1920],['Hosseین',1500]];let people=demo.map(([name,sec])=>({name,sec})),picked=[];const wheel=document.getElementById('wheel');function render(){document.getElementById('list').innerHTML=people.map(p=>`<div class="person"><span>${p.name}</span><span>${Math.round(p.sec/60)} دقیقه · وزن ${weight(p).toFixed(1)}</span></div>`).join('')};function weight(p){return Math.max(0.1,p.sec/60)**Number(document.getElementById('power').value||.75)}function weightedIndex(){let total=people.reduce((s,p)=>s+weight(p),0),r=Math.random()*total;for(let i=0;i<people.length;i++){r-=weight(people[i]);if(r<=0)return i}return people.length-1}function spin(){if(!people.length)return;let i=weightedIndex(),turns=5+Math.floor(Math.random()*3),angle=turns*360+(i+.5)*(360/Math.max(1,people.length));wheel.style.transform=`rotate(${angle}deg)`;setTimeout(()=>{let winner=people.splice(i,1)[0];picked.push(winner.name);document.getElementById('status').textContent=`انتخاب شد: ${winner.name}`;render()},3050)}document.getElementById('spin').onclick=spin;render();(function(){const w=window.Telegram?.WebApp;if(w){w.ready();w.expand()}})();</script></body></html>
