<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pedi Air Raiders</title>
<style>
:root{font-family:system-ui,sans-serif;color:#fff;background:#06111b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111b}canvas{display:block;width:100vw;height:100vh;touch-action:none}.hud{position:fixed;z-index:3;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;font-weight:800;text-shadow:0 2px 4px #000}.pill{background:#001424b8;border:1px solid #ffffff30;border-radius:10px;padding:6px 10px}.help{position:fixed;z-index:3;bottom:8px;left:8px;right:8px;text-align:center;font-size:12px;opacity:.8}.overlay{position:fixed;inset:0;display:none;place-items:center;background:#000b;z-index:5}.overlay.show{display:grid}.panel{width:min(92vw,420px);padding:24px;border:1px solid #ffffff29;border-radius:20px;background:#071421e8;text-align:center;box-shadow:0 20px 60px #000}.btn{border:0;border-radius:12px;padding:12px 20px;background:#1e88e5;color:#fff;font-weight:800;font-size:16px}.btn:active{transform:scale(.98)}
</style></head><body><canvas id="c"></canvas><div class="hud"><span class="pill" id="score">امتیاز 0</span><span class="pill" id="fuel">سوخت 100</span><span class="pill" id="life">جان 3</span><span class="pill" id="level">مرحله 1</span></div><div class="help">لمس و کشیدن برای حرکت · شلیک: ضربه دوم/Space · بمب: B · صدا قابل قطع از منو</div>
<div class="overlay" id="ov"><div class="panel"><h1>✈️ Air Raiders</h1><p id="result"></p><button class="btn" id="again">شروع دوباره</button></div></div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');let W=innerWidth,H=innerHeight,dpr=1;function rs(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',rs);rs();
let state={score:0,fuel:100,life:3,level:1,time:0,over:false,sound:true},keys={},touch={down:false,x:W/2,y:H*.8};
const p={x:.5,y:.82,w:28,h:40,shots:[],bombs:2,inv:0};let enemy=[],ground=[],fuelers=[],bridges=[],bullets=[],enemyBullets=[],lastSpawn=0,frame=0;
let audio=null, musicTimer=null;function tone(freq,dur=.08,type='square',vol=.05){if(!state.sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),a=audio.createGain();o.type=type;o.frequency.value=freq;a.gain.value=vol;o.connect(a).connect(audio.destination);o.start();a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}catch{}}
function music(){if(musicTimer)clearInterval(musicTimer);if(!state.sound)return;const seq=[220,277,330,277,247,294,370,294];let i=0;musicTimer=setInterval(()=>{if(state.over||!state.sound)return;tone(seq[i++%seq.length],.06,'triangle',.025)},360)}
function reset(){state={score:0,fuel:100,life:3,level:1,time:0,over:false,sound:true};p.x=.5;p.y=.82;p.shots=[];p.bombs=2;p.inv=0;enemy=[];ground=[];fuelers=[];bridges=[];bullets=[];enemyBullets=[];lastSpawn=0;frame=0;document.getElementById('ov').classList.remove('show');music();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.key]=1;if(e.code==='Space'){e.preventDefault();shoot()}if(e.key.toLowerCase()==='b')bomb()});addEventListener('keyup',e=>keys[e.key]=0);
c.addEventListener('pointerdown',e=>{touch.down=true;touch.x=e.clientX;touch.y=e.clientY;shoot()});c.addEventListener('pointermove',e=>{if(touch.down){touch.x=e.clientX;touch.y=e.clientY}});addEventListener('pointerup',()=>touch.down=false);document.getElementById('again').onclick=reset;
function shoot(){if(state.over)return;tone(520,.05,'square',.045);bullets.push({x:p.x*W,y:p.y*H-18,v:850,r:3})}function bomb(){if(state.over||p.bombs<1)return;p.bombs--;tone(100,.2,'sawtooth',.08);enemy.forEach(e=>e.hp=0);state.score+=enemy.length*80;}
function spawn(){const lane=.18+Math.random()*.64;let r=Math.random();if(r<.12)fuelers.push({x:lane,y:-.04,s:.12});else if(r<.22)bridges.push({x:.5,y:-.08,s:.0});else if(r<.60)enemy.push({type:'plane',x:lane,y:-.1,v:.12+state.level*.01,hp:1,shoot:Math.random()});else enemy.push({type:'tank',x:lane,y:-.08,v:.08,hp:2,shoot:Math.random()});}
function collide(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs(a.y-b.y)<(a.h+b.h)/2}
function hurt(){if(p.inv>0)return;state.life--;p.inv=1.4;tone(90,.18,'sawtooth',.08);if(state.life<=0)end()}
function end(){state.over=true;document.getElementById('result').textContent=`امتیاز ${state.score} · مرحله ${state.level}`;document.getElementById('ov').classList.add('show')}
function draw(){g.fillStyle='#0b5e7d';g.fillRect(0,0,W,H);let river=.5+.12*Math.sin(state.time*.0007),width=.22+.025*Math.sin(state.time*.001);g.fillStyle='#178448';g.beginPath();g.moveTo(0,0);for(let y=0;y<=H;y+=16)g.lineTo(W*(river-width)+W*.05*Math.sin(y*.01+state.time*.001),y);for(let y=H;y>=0;y-=16)g.lineTo(W*(river+width)+W*.05*Math.sin(y*.01+state.time*.001),y);g.closePath();g.fill();
for(let i=0;i<ground.length;i++){let q=ground[i];g.fillStyle=q.type==='city'?'#686c72':'#476b38';g.fillRect(q.x*W,q.y*H,q.w*W,q.h*H)}for(let b of bridges){g.fillStyle='#aa7940';g.fillRect((river-width)*W,b.y*H,width*W*2,.04*H)}
for(let f of fuelers){g.fillStyle='#ffe34b';g.fillRect(f.x*W-9,f.y*H-9,18,18);g.fillStyle='#fff';g.fillText('F',f.x*W-4,f.y*H+5)}
for(let e of enemy){let ex=e.x*W,ey=e.y*H;if(e.type==='plane'){g.fillStyle='#e53935';g.beginPath();g.moveTo(ex,ey-18);g.lineTo(ex-13,ey+14);g.lineTo(ex,ey+5);g.lineTo(ex+13,ey+14);g.closePath();g.fill()}else{g.fillStyle='#444';g.fillRect(ex-18,ey-10,36,20);g.fillStyle='#9a9';g.fillRect(ex-5,ey-15,10,7)}}for(let b of bullets){g.fillStyle='#fff59d';g.fillRect(b.x-2,b.y-8,4,14)}
let px=p.x*W,py=p.y*H;g.globalAlpha=p.inv>0&&Math.floor(state.time/80)%2?0.3:1;g.fillStyle='#ffe082';g.beginPath();g.moveTo(px,py-22);g.lineTo(px-16,py+18);g.lineTo(px,py+9);g.lineTo(px+16,py+18);g.closePath();g.fill();g.fillStyle='#90caf9';g.fillRect(px-3,py-3,6,18);g.globalAlpha=1}
function loop(now){if(state.over)return;const dt=Math.min(0.032,(now-(loop.last||now))/1000);loop.last=now;state.time+=dt*1000;frame++;state.level=1+Math.floor(state.score/2500);state.fuel=Math.max(0,state.fuel-dt*2.5);if(state.fuel<=0){hurt();state.fuel=35}let sx=((keys.ArrowLeft?-1:0)+(keys.ArrowRight?1:0));let sy=((keys.ArrowUp?-1:0)+(keys.ArrowDown?1:0));p.x+=sx*dt*.55;p.y+=sy*dt*.55;if(touch.down){p.x+=(touch.x/W-p.x)*Math.min(1,dt*8);p.y+=(touch.y/H-p.y)*Math.min(1,dt*8)}p.x=Math.max(.07,Math.min(.93,p.x));p.y=Math.max(.1,Math.min(.92,p.y));p.inv=Math.max(0,p.inv-dt);
if(state.time-lastSpawn>Math.max(320,900-state.level*45)){lastSpawn=state.time;spawn()}for(let b of bullets)b.y-=b.v*dt;for(let b of enemyBullets)b.y+=b.v*dt;for(let e of enemy){e.y+=e.v*dt;e.shoot+=dt;if(e.shoot>1.4&&Math.random()<.02){enemyBullets.push({x:e.x*W,y:e.y*H,v:260});e.shoot=0}}for(let f of fuelers)f.y+=.16*dt;for(let b of bridges)b.y+=.10*dt;for(let b of ground)b.y+=.03*dt;
for(let i=bullets.length-1;i>=0;i--){if(bullets[i].y<0)bullets.splice(i,1)}for(let i=enemy.length-1;i>=0;i--){let e=enemy[i],ex={x:e.x*W,y:e.y*H,w:e.type==='plane'?28:40,h:32};for(let j=bullets.length-1;j>=0;j--){if(collide({x:bullets[j].x,y:bullets[j].y,w:5,h:15},ex)){e.hp--;bullets.splice(j,1);tone(180,.03,'square',.03);if(e.hp<=0){enemy.splice(i,1);state.score+=e.type==='plane'?120:160}break}}if(e.y>1.1)enemy.splice(i,1);else if(collide({x:p.x*W,y:p.y*H,w:p.w,h:p.h},ex)){enemy.splice(i,1);hurt()}}
for(let i=enemyBullets.length-1;i>=0;i--){let b=enemyBullets[i];if(b.y>H)enemyBullets.splice(i,1);else if(Math.abs(b.x-p.x*W)<16&&Math.abs(b.y-p.y*H)<25){enemyBullets.splice(i,1);hurt()}}for(let i=fuelers.length-1;i>=0;i--){let f=fuelers[i];if(f.y>1.1)fuelers.splice(i,1);else if(Math.abs(f.x-p.x)<.05&&Math.abs(f.y-p.y)<.06){fuelers.splice(i,1);state.fuel=Math.min(100,state.fuel+35);state.score+=50;tone(780,.08,'triangle',.04)}}for(let i=bridges.length-1;i>=0;i--){if(bridges[i].y>1.1){bridges.splice(i,1);state.score+=300;tone(260,.08,'triangle',.035)}}state.score+=Math.floor(dt*20);document.getElementById('score').textContent='امتیاز '+state.score;document.getElementById('fuel').textContent='سوخت '+Math.round(state.fuel);document.getElementById('life').textContent='جان '+state.life;document.getElementById('level').textContent='مرحله '+state.level;draw();requestAnimationFrame(loop)}
(function(){const w=window.Telegram?.WebApp;if(w){w.ready();w.expand()}})();reset();
</script></body></html>
