<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Pedi Backgammon</title><style>
:root{--wood:#4a2818;--wood2:#754622;--felt:#124332;--gold:#e9b44c}*{box-sizing:border-box}body{margin:0;padding:12px;background:radial-gradient(circle at 50% 0,#304658,#080e14 65%);color:#fff;font-family:system-ui}.wrap{max-width:1100px;margin:auto}.card{background:#08151fe8;border:1px solid #ffffff1f;border-radius:22px;padding:14px;box-shadow:0 24px 70px #0009}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.title{font-size:25px;font-weight:900}.muted{font-size:12px;opacity:.7}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 14px;background:#173a5a;color:#fff;font-weight:800}.primary{background:linear-gradient(135deg,#efc55b,#af6e1f);color:#211507}.board{direction:ltr;margin-top:14px;background:var(--wood2);border:12px solid var(--wood);border-radius:18px;padding:8px;display:grid;grid-template-columns:54px repeat(12,1fr) 54px;grid-template-rows:1fr 1fr;min-height:650px;gap:4px;box-shadow:inset 0 0 0 2px #d7a76a66,0 18px 60px #000c}.half{background:linear-gradient(90deg,#12382c,#17513d);padding:5px;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;grid-column:2/14}.top{grid-row:1}.bottom{grid-row:2}.bar{background:#2d1b12;grid-row:1/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;border-radius:8px;color:#e8c47e}.point{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:flex-start;flex-direction:column;cursor:pointer;border-radius:4px}.bottom .point{justify-content:flex-end}.tri{position:absolute;inset:0 7%;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:112px solid #cf975255}.bottom .tri{border-bottom:0;border-top:112px solid #5a2d2855}.point:nth-child(odd) .tri{border-bottom-color:#562d2355}.bottom .point:nth-child(odd) .tri{border-top-color:#cf975255}.num{position:relative;z-index:3;font-size:10px;opacity:.7}.checkers{position:relative;z-index:2;display:flex;flex-direction:column;gap:2px;align-items:center;max-height:84%;overflow:hidden}.bottom .checkers{flex-direction:column-reverse}.checker{width:33px;height:33px;border-radius:50%;border:2px solid #ffffff40;box-shadow:0 4px 8px #0009}.white{background:radial-gradient(circle at 35% 25%,#fff,#cbbfa7);}.black{background:radial-gradient(circle at 35% 25%,#555,#050505)}.selected{outline:3px solid var(--gold);box-shadow:0 0 20px #e9b44c66}.foot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}.pill{background:#06111bcc;border:1px solid #ffffff20;padding:8px 10px;border-radius:10px}.dice{font-size:26px;letter-spacing:7px}.good{color:#a7f3d0;font-weight:900}@media(max-width:760px){.board{grid-template-columns:34px repeat(12,1fr) 34px;min-height:480px;border-width:7px;padding:5px}.checker{width:23px;height:23px}.tri{border-bottom-width:80px}.bottom .tri{border-top-width:80px}}
</style></head><body><div class="wrap"><div class="card"><div class="head"><div><div class="title">🎲 تخته‌نرد Pedi</div><div class="muted">۲۴ خانه · بار · زدن · ورود · دابل · خارج کردن مهره</div></div><div class="actions"><button class="btn primary" id="roll">🎲 تاس</button><button class="btn" id="new">بازی جدید</button><button class="btn" id="sound">🔊 صدا</button></div></div><div class="board"><div class="bar" id="barW"></div><div class="half top" id="top"></div><div class="half bottom" id="bottom"></div><div class="bar" id="barB"></div></div><div class="foot"><div class="pill" id="turn">نوبت شما</div><div class="pill dice" id="dice">—</div><div class="pill" id="status">ابتدا تاس بیندازید.</div></div></div></div>
<script>
const initial=[2,0,0,0,0,-5,0,-3,0,0,0,5,-5,0,0,0,3,5,0,0,0,0,0,-2];
let pts=[...initial],barW=0,barB=0,offW=0,offB=0,turn='w',dice=[],sel=-1,over=false,sound=true;
const $=id=>document.getElementById(id);const die=()=>1+Math.floor(Math.random()*6);function beep(f=520,d=.06){if(!sound)return;try{const A=new (window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.value=.035;o.connect(g).connect(A.destination);o.start();o.stop(A.currentTime+d)}catch{}}
function homeOk(c){if(c==='w'){for(let i=0;i<18;i++)if(pts[i]>0)return false;return true}for(let i=6;i<24;i++)if(pts[i]<0)return false;return true}
function destination(from,d,c){return c==='w'?from+d:from-d}
function targetOpen(to,c){return to>=0&&to<24&&(c==='w'?pts[to]>=-1:pts[to]<=1)}
function movesFrom(from,c){const out=[];for(const d of dice){const to=destination(from,d,c);if(to>=0&&to<24&&targetOpen(to,c))out.push({d,to});else if(homeOk(c)&&((c==='w'&&to>=24)||(c==='b'&&to<0))&&canBearWithDie(from,d,c))out.push({d,to});}return out}
function canBearWithDie(from,d,c){if(!homeOk(c))return false;if(c==='w'){if(from+d>=24)return true;for(let i=from+1;i<24;i++)if(pts[i]>0)return false;return false}else{if(from-d<0)return true;for(let i=0;i<from;i++)if(pts[i]<0)return false;return false}}
function hasLegal(c){if(c==='w'&&barW>0)return dice.some(d=>targetOpen(d-1,'w'));if(c==='b'&&barB>0)return dice.some(d=>targetOpen(24-d,'b'));for(let i=0;i<24;i++)if((c==='w'?pts[i]>0:pts[i]<0)&&movesFrom(i,c).length)return true;return false}
function useDie(d){const k=dice.indexOf(d);if(k>=0)dice.splice(k,1)}
function apply(from,to,d,c){if(to<0||to>23){if(c==='w'){pts[from]--;offW++}else{pts[from]++;offB++}useDie(d);return true}if(c==='w'){pts[from]--;if(pts[to]===-1){pts[to]=1;barB++}else pts[to]++}else{pts[from]++;if(pts[to]===1){pts[to]=-1;barW++}else pts[to]--}useDie(d);beep(300,.05);return true}
function enterFromBar(d,c){const to=c==='w'?d-1:24-d;if(!targetOpen(to,c))return false;if(c==='w'){if(pts[to]===-1){pts[to]=1;barB++}else pts[to]++;barW--}else{if(pts[to]===1){pts[to]=-1;barW++}else pts[to]--;barB--}useDie(d);beep(360,.05);return true}
function playerPick(i){if(over||turn!=='w'||!dice.length)return;if(barW>0){for(const d of [...dice])if(enterFromBar(d,'w'))break;draw();endPlayer();return}if(sel<0){if(pts[i]>0&&movesFrom(i,'w').length){sel=i;draw()}return}const m=movesFrom(sel,'w').find(m=>m.to===i);if(m){apply(sel,i,m.d,'w');sel=-1;draw();endPlayer();return}const d=Math.abs(i-sel);if(canBearWithDie(sel,d,'w')){apply(sel,24,d,'w');sel=-1;draw();endPlayer();return}sel=-1;draw()}
function endPlayer(){if(offW>=15){over=true;}if(offW>=15){$('status').innerHTML='<span class="good">🏆 شما برنده شدید!</span>';draw();return}if(!dice.length){turn='b';draw();setTimeout(aiTurn,500)}else if(!hasLegal('w')){dice=[];turn='b';draw();setTimeout(aiTurn,500)}
function aiTurn(){if(over)return;let a=die(),b=die();dice=a===b?[a,a,a,a]:[a,b];if(barB){for(const d of [...dice])enterFromBar(d,'b')}let guard=0;while(dice.length&&guard++<8){let choices=[];if(barB){for(const d of dice){if(targetOpen(24-d,'b'))choices.push({from:24,to:24-d,d})}}else{for(let i=0;i<24;i++)if(pts[i]<0)for(const m of movesFrom(i,'b'))choices.push({from:i,...m})}if(!choices.length)break;choices.sort((x,y)=>((pts[y.to]||0)-(pts[x.to]||0)));const m=choices[0];apply(m.from,m.to,m.d,'b')}dice=[];sel=-1;if(offB>=15){over=true;$('status').innerHTML='<span class="good">🤖 هوش مصنوعی برنده شد.</span>';draw();return}turn='w';draw()}
function reset(){pts=[...initial];barW=barB=offW=offB=0;turn='w';dice=[];sel=-1;over=false;draw()}
function point(val,idx,top){const d=document.createElement('div');d.className='point '+(sel===idx?'selected':'');d.onclick=()=>playerPick(idx);const tri=document.createElement('div');tri.className='tri';d.appendChild(tri);const num=document.createElement('div');num.className='num';num.textContent=idx+1;d.appendChild(num);const list=document.createElement('div');list.className='checkers';for(let j=0;j<Math.min(7,Math.abs(val));j++){const c=document.createElement('div');c.className='checker '+(val>0?'white':'black');if(Math.abs(val)>7&&j===6)c.textContent=Math.abs(val);list.appendChild(c)}d.appendChild(list);return d}
function draw(){ $('top').innerHTML='';$('bottom').innerHTML='';for(let s=0;s<12;s++){const ti=s<6?23-s:s-6;const bi=s<6?s:17-(s-6);$('top').appendChild(point(pts[ti],ti,true));$('bottom').appendChild(point(pts[bi],bi,false))}$('barW').innerHTML=`<b>بار</b><div>⚪ ${barW}</div><div>بیرون ${offW}</div>`;$('barB').innerHTML=`<b>بار</b><div>⚫ ${barB}</div><div>بیرون ${offB}</div>`;$('turn').textContent=over?'پایان بازی':turn==='w'?'نوبت شما':'نوبت هوش مصنوعی';$('dice').textContent=dice.length?dice.join('  '):'—';if(!over&&turn==='w')$('status').textContent=barW?'ابتدا مهره روی بار را وارد کنید.':'مهره را انتخاب، سپس مقصد را بزنید.';$('roll').disabled=over||turn!=='w'||dice.length>0}
$('roll').onclick=()=>{let a=die(),b=die();dice=a===b?[a,a,a,a]:[a,b];beep(720,.1);draw()};$('new').onclick=reset;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 صدا':'🔇 صدا'};reset();
</script></body></html>
